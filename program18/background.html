
<html>
<head>
    <title>Simple Background Changer</title>
</head>
<body style="background-color: lavender;">
    <button onclick="changeColor()">Change Color</button>
    <button onclick="changeBackgroundImage()">Change Background Image</button>
    <button onclick="resetBackground()">Resume to Normal</button>

    <script>
        const originalColor = "lavender";
        const originalImage = "";

        function changeColor() {
            document.body.style.backgroundImage = "";
            document.body.style.backgroundColor = "powderblue";
        }

        function changeBackgroundImage() {
            document.body.style.backgroundColor = "";
            document.body.style.backgroundImage = "url('https://i.pinimg.com/474x/c5/85/5a/c5855a173964c50f4828998abe290663.jpg?nii=t')";

        }

        function resetBackground() {
            document.body.style.backgroundColor = originalColor;
            document.body.style.backgroundImage = originalImage;
        }
    </script>
</body>
</html>
